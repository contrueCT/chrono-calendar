name: chrono_calendar
description: "Chrono - 现代化 Flutter 日历应用，集成 AI 智能功能"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ========== 状态管理 ==========
  provider: ^6.1.2

  # ========== 数据存储 ==========
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # ========== 网络请求 ==========
  dio: ^5.7.0

  # ========== 路由 ==========
  go_router: ^14.6.2

  # ========== 日历 UI ==========
  table_calendar: ^3.1.2

  # ========== 时间处理 ==========
  timezone: ^0.9.4
  intl: ^0.19.0

  # ========== 农历 ==========
  lunar: ^1.3.0

  # ========== iCalendar ==========
  icalendar_parser: ^2.0.0

  # ========== 通知 ==========
  flutter_local_notifications: ^18.0.1

  # ========== 文件操作 ==========
  file_picker: ^8.0.3

  # ========== UI 组件 ==========
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.1.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.1.1
  cached_network_image: ^3.4.1

  # ========== 分享 ==========
  share_plus: ^10.1.4

  # ========== 定位 (天气) ==========
  geolocator: ^13.0.2

  # ========== 工具 ==========
  uuid: ^4.4.0
  app_settings: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
